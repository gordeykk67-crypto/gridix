<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1115">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Gridix</title>
<style>
  :root { --bg:#0f1115; --panel:#181b22; --line:#262a33; --text:#e8eaf0; --muted:#8a90a0; --accent:#4f8cff; --mine:#2b5fd9; --other:#222633; }
  * { box-sizing:border-box; -webkit-tap-highlight-color:transparent; }
  html, body { margin:0; height:100%; background:var(--bg); color:var(--text); font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif; }
  #app { height:100dvh; display:flex; flex-direction:column; max-width:720px; margin:0 auto; }
  header { padding:12px 16px; background:var(--panel); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; }
  header h1 { margin:0; font-size:20px; letter-spacing:.5px; }
  header h1 span { color:var(--accent); }
  header button { background:none; border:1px solid var(--line); color:var(--muted); padding:6px 12px; border-radius:8px; font-size:13px; }
  #auth { flex:1; display:flex; flex-direction:column; justify-content:center; gap:12px; padding:24px; }
  #auth h2 { margin:0 0 4px; font-size:28px; text-align:center; }
  #auth h2 span { color:var(--accent); }
  #auth p.sub { margin:0 0 12px; text-align:center; color:var(--muted); }
  input { width:100%; padding:14px; font-size:16px; background:var(--panel); border:1px solid var(--line); border-radius:12px; color:var(--text); outline:none; }
  input:focus { border-color:var(--accent); }
  .btn { padding:14px; font-size:16px; font-weight:600; border:none; border-radius:12px; background:var(--accent); color:#fff; }
  .btn:disabled { opacity:.6; }
  .link { background:none; border:none; color:var(--accent); font-size:14px; padding:6px; }
  #err { color:#ff6b6b; text-align:center; min-height:20px; font-size:14px; }
  #chat { flex:1; display:none; flex-direction:column; min-height:0; }
  #list { flex:1; overflow-y:auto; padding:12px; display:flex; flex-direction:column; gap:6px; }
  .msg { max-width:80%; padding:8px 12px; border-radius:16px; background:var(--other); word-wrap:break-word; overflow-wrap:anywhere; white-space:pre-wrap; }
  .msg.mine { align-self:flex-end; background:var(--mine); border-bottom-right-radius:4px; }
  .msg:not(.mine) { align-self:flex-start; border-bottom-left-radius:4px; }
  .msg .name { display:block; font-size:12px; font-weight:600; color:#8fb4ff; margin-bottom:2px; }
  .msg .time { display:block; font-size:11px; color:rgba(255,255,255,.5); text-align:right; margin-top:2px; }
  form#send { display:flex; gap:8px; padding:10px 12px calc(10px + env(safe-area-inset-bottom)); background:var(--panel); border-top:1px solid var(--line); }
  form#send input { border-radius:20px; }
  form#send button { width:48px; border:none; border-radius:50%; background:var(--accent); color:#fff; font-size:20px; flex-shrink:0; }
  .empty { text-align:center; color:var(--muted); margin-top:40px; }
</style>
</head>
<body>
<div id="app">
  <header>
    <h1>Grid<span>ix</span></h1>
    <button id="logout" style="display:none">Выйти</button>
  </header>

  <div id="auth">
    <h2>Grid<span>ix</span></h2>
    <p class="sub" id="authSub">Вход</p>
    <input id="u" placeholder="Имя (латиницей, без пробелов)" autocomplete="username" autocapitalize="none">
    <input id="p" type="password" placeholder="Пароль (от 6 символов)" autocomplete="current-password">
    <div id="err"></div>
    <button class="btn" id="go">Войти</button>
    <button class="link" id="toggle">Нет аккаунта? Зарегистрироваться</button>
  </div>

  <div id="chat">
    <div id="list"></div>
    <form id="send">
      <input id="t" placeholder="Сообщение" autocomplete="off" maxlength="2000">
      <button type="submit" aria-label="Отправить">➤</button>
    </form>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const SUPABASE_URL = "https://zvrznubkikqvnlpibklj.supabase.co";
const SUPABASE_KEY = "sb_publishable_NfWo4l_KIZS4ZXGPrGgg1w_pGg6uJx9";
const sb = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

const $ = id => document.getElementById(id);
let mode = "login", me = null, channel = null;

function emailFor(name) { return "gx." + name.toLowerCase() + "@gmail.com"; }
function setErr(m) { $("err").textContent = m || ""; }

$("toggle").onclick = () => {
  mode = mode === "login" ? "signup" : "login";
  $("authSub").textContent = mode === "login" ? "Вход" : "Регистрация";
  $("go").textContent = mode === "login" ? "Войти" : "Создать аккаунт";
  $("toggle").textContent = mode === "login" ? "Нет аккаунта? Зарегистрироваться" : "Уже есть аккаунт? Войти";
  setErr("");
};

$("go").onclick = async () => {
  const name = $("u").value.trim();
  const pass = $("p").value;
  if (!/^[A-Za-z0-9_]{2,20}$/.test(name)) return setErr("Имя: 2–20 символов, латиница, цифры или _");
  if (pass.length < 6) return setErr("Пароль минимум 6 символов");
  $("go").disabled = true; setErr("");
  try {
    let res;
    if (mode === "signup") {
      res = await sb.auth.signUp({ email: emailFor(name), password: pass, options: { data: { username: name } } });
    } else {
      res = await sb.auth.signInWithPassword({ email: emailFor(name), password: pass });
    }
    if (res.error) {
      const m = res.error.message || "";
      if (/already/i.test(m)) setErr("Такое имя уже занято");
      else if (/invalid login/i.test(m)) setErr("Неверное имя или пароль");
      else setErr(m);
    } else if (!res.data.session) {
      setErr("Включите вход без подтверждения почты в Supabase");
    }
  } catch (e) { setErr("Нет связи, попробуйте ещё раз"); }
  $("go").disabled = false;
};

$("logout").onclick = () => sb.auth.signOut();

function fmtTime(iso) {
  const d = new Date(iso);
  return d.toLocaleTimeString("ru-RU", { hour: "2-digit", minute: "2-digit" });
}

function addMsg(m) {
  const list = $("list");
  const empty = list.querySelector(".empty"); if (empty) empty.remove();
  if (list.querySelector('[data-id="' + m.id + '"]')) return;
  const mine = m.user_id === me.id;
  const el = document.createElement("div");
  el.className = "msg" + (mine ? " mine" : "");
  el.dataset.id = m.id;
  if (!mine) { const n = document.createElement("span"); n.className = "name"; n.textContent = m.username; el.appendChild(n); }
  el.appendChild(document.createTextNode(m.text));
  const t = document.createElement("span"); t.className = "time"; t.textContent = fmtTime(m.created_at);
  el.appendChild(t);
  const nearBottom = list.scrollHeight - list.scrollTop - list.clientHeight < 120;
  list.appendChild(el);
  if (nearBottom || mine) list.scrollTop = list.scrollHeight;
}

async function openChat(user) {
  me = user;
  $("auth").style.display = "none";
  $("chat").style.display = "flex";
  $("logout").style.display = "";
  const list = $("list"); list.innerHTML = "";
  const { data, error } = await sb.from("messages").select("*").order("created_at", { ascending: false }).limit(100);
  if (error) { list.innerHTML = '<div class="empty">Не удалось загрузить сообщения</div>'; }
  else if (!data.length) { list.innerHTML = '<div class="empty">Пока пусто. Напишите первое сообщение!</div>'; }
  else data.reverse().forEach(addMsg);
  list.scrollTop = list.scrollHeight;
  if (channel) sb.removeChannel(channel);
  channel = sb.channel("messages-feed")
    .on("postgres_changes", { event: "INSERT", schema: "public", table: "messages" }, p => addMsg(p.new))
    .subscribe();
}

function closeChat() {
  me = null;
  if (channel) { sb.removeChannel(channel); channel = null; }
  $("chat").style.display = "none";
  $("auth").style.display = "flex";
  $("logout").style.display = "none";
  $("p").value = "";
}

$("send").onsubmit = async e => {
  e.preventDefault();
  const text = $("t").value.trim();
  if (!text || !me) return;
  $("t").value = "";
  const username = (me.user_metadata && me.user_metadata.username) || "user";
  const { error } = await sb.from("messages").insert({ username, text });
  if (error) { $("t").value = text; alert("Не удалось отправить: " + error.message); }
  $("t").focus();
};

sb.auth.onAuthStateChange((_ev, session) => {
  if (session && session.user) { if (!me || me.id !== session.user.id) openChat(session.user); }
  else closeChat();
});
</script>
</body>
</html>
